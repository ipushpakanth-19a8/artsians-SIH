# ShilpSetu (KALAtech) Android Release Keystore Configuration Template
# DO NOT commit real passwords or private keystore files to git repositories.
#
# To generate your own production release keystore, run:
#   keytool -genkey -v -keystore release-keystore.jks -alias kalatech-release -keyalg RSA -keysize 2048 -validity 10000
#
# Then fill in the following properties or set environment variables:
#
# KEYSTORE_FILE=release-keystore.jks
# KEYSTORE_PASSWORD=YourKeystorePasswordHere
# KEY_ALIAS=kalatech-release
# KEY_PASSWORD=YourKeyPasswordHere
