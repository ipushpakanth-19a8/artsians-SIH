<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>KALAtech — Artisan Market Linkage & Smart Cataloging</title>
    <meta name="description" content="AI-powered mobile and web solution for marginalized artisans featuring low-literacy multimodal cataloging, before/after photo enhancement, cost-plus fair price reasoning, market linkage channel matching, multilingual translation, and direct buyer enquiry connectivity." />
    
    <meta property="og:title" content="KALAtech — Artisan Market Linkage & Smart Cataloging" />
    <meta property="og:description" content="AI-powered mobile and web solution for marginalized artisans featuring low-literacy multimodal cataloging, before/after photo enhancement, cost-plus fair price reasoning, market linkage channel matching, multilingual translation, and direct buyer enquiry connectivity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23d97706'/><text x='50%' y='58%' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-size='46' font-weight='900' fill='white'>KT</text></svg>" />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rozha+One&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- File Protocol & Startup Diagnostic Helper -->
    <script>
      // Detect if user opened index.html directly from Windows File Explorer
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = `
              <div style="font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 24px; background: #fffbeb; border: 2px solid #f59e0b; border-radius: 12px; color: #78350f; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                  <span style="font-size: 28px;">⚠️</span>
                  <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #b45309;">KALAtech requires the Node.js Server</h2>
                </div>
                <p style="margin: 8px 0; font-size: 15px; line-height: 1.5;">
                  You are opening <code>index.html</code> directly as a file (<code>file://</code>). Modern React + TypeScript applications cannot run directly from File Explorer.
                </p>
                <div style="background: #1c1917; color: #f5f5f4; padding: 14px 18px; border-radius: 8px; margin: 16px 0; font-family: monospace; font-size: 14px;">
                  <p style="margin: 0 0 6px 0; color: #a8a29e;"># 1. Start the project in PowerShell:</p>
                  <p style="margin: 0 0 8px 0; color: #34d399; font-weight: bold;">npm run dev</p>
                  <p style="margin: 0 0 6px 0; color: #a8a29e;"># 2. Open this URL in your browser:</p>
                  <p style="margin: 0; color: #60a5fa; font-weight: bold;">http://localhost:3000</p>
                </div>
                <p style="margin: 8px 0 0 0; font-size: 13px; color: #92400e;">
                  Once running, visit <a href="http://localhost:3000" style="color: #b45309; font-weight: bold; text-decoration: underline;">http://localhost:3000</a> to view KALAtech with full HTML, CSS, and AI features active.
                </p>
              </div>
            `;
          }
        });
      }
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif; background: #fee2e2; color: #991b1b;">
        JavaScript is required to run KALAtech. Please enable JavaScript in your browser settings.
      </div>
    </noscript>

    <div id="root">
      <!-- Loading indicator shown while React bundle is mounting -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafaf9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #d97706; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 22px; box-shadow: 0 8px 20px rgba(217, 119, 6, 0.3); margin-bottom: 20px;">
          KT
        </div>
        <div style="font-size: 20px; font-weight: 700; color: #1c1917; margin-bottom: 8px;">
          KALAtech <span style="color: #d97706;">कलाTech</span>
        </div>
        <p style="color: #78716c; font-size: 14px; margin: 0 0 24px 0;">Loading Artisan Market Linkage...</p>
        <div style="width: 32px; height: 32px; border: 3px solid #e7e5e4; border-top-color: #d97706; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
